services:
  postgres:
    image: postgres:16-alpine
    container_name: fixiq-postgres
    restart: always
    environment:
      POSTGRES_USER: fixiq_user
      POSTGRES_PASSWORD: fixiq_password
      POSTGRES_DB: fixiq_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixiq_user -d fixiq_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
